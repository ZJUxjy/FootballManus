# Filtering configuration for selecting top youth players
filtering:
  # Top percentile by Current Ability (CA) to keep
  ca_percentile: 0.1
  # Top percentile by Potential Ability (PA) from remaining players
  pa_percentile: 0.2
  # Minimum players to retain per country regardless of filtering
  min_players_per_country: 1000
  # Minimum CA/PA ratio (CA must be >= this ratio * PA)
  ca_pa_ratio_min: 0.4

# Generation parameters for player attribute distributions
generation:
  # Age distribution: youth players aged 14-21, centered at 16
  age:
    mean: 16.0
    std: 2.0
    min_val: 14.0
    max_val: 21.0
  
  # Current Ability distribution: most youth have CA 25-55
  ca:
    mean: 40.0
    std: 15.0
    min_val: 0.0
    max_val: 100.0
  
  # Potential Ability distribution: most youth have PA 40-80
  pa:
    mean: 60.0
    std: 20.0
    min_val: 0.0
    max_val: 200.0

# Export configuration for generated youth players
export:
  # Supported export formats: json, csv, sqlite
  formats:
    - json
    - csv
    - sqlite
  # Number of players per export batch (for memory efficiency)
  batch_size: 10000
  # Output directory for exported files
  output_dir: data/youth_players/
